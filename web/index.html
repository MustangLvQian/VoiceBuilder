<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoiceBuilder 录音工作站</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --ink: #241a15;
    --ink-soft: #6b5a51;
    --paper: #faf6f2;
    --card: #ffffff;
    --line: #e7ddd5;
    --accent: #c2491c;
    --accent-soft: #fdece4;
    --good: #1f7a4d;
    --good-soft: #e6f4ec;
    --warn: #a56a00;
    --warn-soft: #fdf3e0;
    --bad: #b3261e;
    --bad-soft: #fdeceb;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, select, input { font: inherit; color: inherit; }
  button {
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 10px;
    padding: 9px 14px;
    cursor: pointer;
    transition: background .12s ease, border-color .12s ease, transform .06s ease;
  }
  button:hover:not(:disabled) { border-color: #d6c7bd; background: #fffdfb; }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover:not(:disabled) { background: #a83c14; border-color: #a83c14; }
  a { color: var(--accent); }

  .app { max-width: 900px; margin: 0 auto; padding: 20px 20px 60px; }
  header.bar {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    justify-content: space-between; margin-bottom: 16px;
  }
  h1 { font-size: 19px; margin: 0; letter-spacing: .2px; }
  h1 small { font-weight: 400; color: var(--ink-soft); font-size: 13px; margin-left: 8px; }

  .progress { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-soft); }
  .track { width: 180px; height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .track > span { display: block; height: 100%; width: 0; background: var(--good); transition: width .25s ease; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 22px;
  }
  .card + .card { margin-top: 16px; }

  .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  .chip {
    font-size: 12px; padding: 3px 9px; border-radius: 99px;
    background: var(--accent-soft); color: #8d3411; border: 1px solid #f6d9ca;
  }
  .chip.plain { background: #f4efeb; color: var(--ink-soft); border-color: var(--line); }

  .line-text {
    font-size: 27px; line-height: 1.45; letter-spacing: .1px;
    margin: 4px 0 20px; min-height: 2.9em;
  }
  .line-text .dim { color: #c9b8ad; }

  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

  .rec {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 12px 22px; font-size: 17px; font-weight: 600;
    border-radius: 11px; border: 1px solid var(--line); background: var(--card);
  }
  .rec .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--bad); }
  .rec.on { background: var(--bad); border-color: var(--bad); color: #fff; }
  .rec.on .dot { background: #fff; border-radius: 3px; animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .rec:disabled { opacity: .45; }

  .timer { font-variant-numeric: tabular-nums; font-size: 17px; color: var(--ink-soft); min-width: 62px; }
  .meter { width: 150px; height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .meter > span { display: block; height: 100%; width: 0; background: var(--good); }

  .status { margin-top: 16px; font-size: 14px; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--line); background: #fbf8f6; }
  .status .label { font-weight: 600; }
  .status.good { background: var(--good-soft); border-color: #cfe7d9; }
  .status.warn { background: var(--warn-soft); border-color: #f0e0be; }
  .status.bad { background: var(--bad-soft); border-color: #f2cfcc; }
  .status .diff { font-family: ui-monospace, Consolas, monospace; font-size: 13px; margin-top: 6px; word-break: break-word; }
  .status .diff b { color: var(--good); }
  .status .diff i { color: var(--bad); text-decoration: line-through; font-style: normal; }
  .hidden { display: none !important; }

  .line-grid {
    display: flex; flex-wrap: wrap; gap: 14px 12px;
    margin: 4px 0 18px; line-height: 1.5;
  }
  .word-cell {
    display: inline-flex; flex-direction: column; align-items: center;
    min-width: 38px;
  }
  .word-cell .ipa-above {
    font-family: ui-monospace, Consolas, monospace;
    font-size: 12px; color: #b06a38; margin-bottom: 3px;
    white-space: nowrap;
  }
  .word-cell .word-below {
    font-size: 19px; font-weight: 600; color: var(--ink);
    border-bottom: 2px solid #e7ddd5; padding-bottom: 2px;
  }
  .word-cell.punct { min-width: auto; }
  .word-cell.punct .ipa-above { visibility: hidden; }
  .word-cell.punct .word-below {
    border-bottom: none; color: var(--ink-soft); font-weight: 400;
  }

  .nav { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 16px; }
  .spacer { flex: 1 1 auto; }
  .hint { font-size: 12.5px; color: var(--ink-soft); }
  .ipa {
    font-family: ui-monospace, Consolas, monospace;
    font-size: 14px; color: var(--ink-soft); margin: 2px 0 10px;
    letter-spacing: .02em; line-height: 1.7; word-break: break-word;
  }
  .tips { margin: 0 0 14px; padding: 10px 12px; border-radius: 10px;
    background: #fdf9f4; border: 1px solid #f0e6dd; }
  .tips .tips-title { font-size: 12px; font-weight: 600; color: var(--ink-soft);
    margin-bottom: 6px; }
  .tips ul { margin: 0; padding-left: 18px; font-size: 12.5px; color: var(--ink-soft); }
  .tips li { margin-bottom: 3px; line-height: 1.5; }
  kbd {
    border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px;
    padding: 1px 5px; background: #fff; font-family: inherit; font-size: 12px;
  }

  details.tools { margin-top: 26px; }
  details.tools > summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--ink-soft); }
  .tool-grid { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
  pre.console {
    background: #241a15; color: #f3ece7; border-radius: 10px; padding: 14px;
    font: 12.5px/1.55 ui-monospace, Consolas, monospace; max-height: 300px; overflow: auto;
    white-space: pre-wrap; word-break: break-word; margin: 0;
  }
  .reports { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13.5px; margin-top: 12px; }
  .field { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; font-size: 13.5px; }
  .field input[type=text] { flex: 1 1 320px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .empty { color: var(--ink-soft); }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <h1>VoiceBuilder 录音工作站 <small>逐句录，自动存成正确文件名</small></h1>
    <div class="progress">
      <span id="progress-label">已录 0 / 0</span>
      <span class="track"><span id="progress-fill"></span></span>
    </div>
  </header>

  <div id="banner" class="status bad hidden"></div>

  <section class="card" id="recorder-card">
    <div class="meta">
      <span class="chip" id="clip-index">第 1 / 89 条</span>
      <span class="chip plain" id="clip-group">—</span>
      <span class="chip plain" id="clip-file">—</span>
      <span class="chip plain hidden" id="clip-state"></span>
    </div>

    <div class="line-grid" id="clip-line-grid" lang="en"></div>
    <div class="tips hidden" id="clip-tips">
      <div class="tips-title">发音提示</div>
      <ul id="clip-tips-list"></ul>
    </div>

    <div class="controls">
      <button id="btn-sample" title="快捷键 S">播放示范</button>
      <button id="btn-mine" title="快捷键 P">播放我的录音</button>
      <span class="spacer"></span>
      <span class="timer" id="timer">0.0s</span>
      <span class="meter" title="输入电平"><span id="meter-fill"></span></span>
      <button class="rec" id="btn-rec" title="快捷键 空格"><span class="dot"></span><span id="rec-label">开始录音</span></button>
    </div>

    <div id="status" class="status hidden"></div>

    <div class="nav">
      <button id="btn-prev" title="上一条 (←)">←</button>
      <button id="btn-next" title="下一条 (→)">→</button>
      <button id="btn-first-unrecorded" title="跳到第一条还没录的">第一条未录</button>
      <span class="spacer"></span>
      <label class="hint"><input type="checkbox" id="only-unrecorded"> 只看未录</label>
      <button id="btn-delete" title="删除这条的录音">删除</button>
    </div>

    <p class="hint" style="margin:16px 0 0">
      <kbd>空格</kbd> 录音 / 停止　<kbd>S</kbd> 示范　<kbd>P</kbd> 我的录音　
      <kbd>←</kbd><kbd>→</kbd> 切换　<kbd>Enter</kbd> 下一条
    </p>
  </section>

  <section class="card">
    <div class="field">
      <label><input type="checkbox" id="auto-save" checked> 停录后自动保存</label>
      <label><input type="checkbox" id="auto-verify"> 保存后自动做内容校验（较慢，需 ASR 模型）</label>
      <label>麦克风
        <select id="mic-select"><option value="">默认设备</option></select>
      </label>
    </div>
    <div class="field">
      <label style="white-space:nowrap">App 仓库路径</label>
      <input type="text" id="app-root" placeholder="例如 D:\path\to\YingChuangXingQiu">
      <button id="btn-save-root">保存</button>
      <span class="hint" id="root-state"></span>
    </div>
  </section>

  <details class="tools">
    <summary>收尾与工具（全部录完后用）</summary>

    <div class="tool-grid" id="step-buttons"></div>
    <div class="tool-grid">
      <button id="btn-oneclick" class="primary">一键收尾：校验 → 打包 → 发布</button>
      <button id="btn-import">导入 work/inbox 里的原始文件</button>
      <button id="btn-refresh">重新载入清单</button>
    </div>

    <pre class="console" id="console">就绪。录音保存在 work/audio/，示范音来自 work/samples/。</pre>

    <div class="reports" id="reports"></div>
  </details>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
